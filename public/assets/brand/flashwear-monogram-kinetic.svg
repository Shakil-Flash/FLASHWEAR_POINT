<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" role="img" aria-label="FLASHWEAR Lightning Strike Monogram">
  <title>FLASHWEAR Lightning Strike Monogram</title>
  <defs>
    <linearGradient id="strikeGrad" x1="52" y1="96" x2="74" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C41420"/>
      <stop offset="60%" stop-color="#FF4A16"/>
      <stop offset="100%" stop-color="#FFC52E"/>
    </linearGradient>
  </defs>
  <g id="fw-monogram-lightning">
    <!-- F Component in Cloud White -->
    <path d="M22 24H62V38H38V52H56V66H38V96H22V24Z" fill="#F5F5F5"/>
    <!-- Kinetic Lightning Shard: Gradient from Flash Red to Lightning Gold -->
    <polygon points="52,96 66,52 74,52 63,96" fill="url(#strikeGrad)"/>
    <!-- W Center and Right Stem in Cloud White -->
    <path d="M68.5 96L80.5 52H96L83 96H68.5Z" fill="#F5F5F5"/>
    <polygon points="69.5,83 75.5,65 80.5,80" fill="#F5F5F5"/>
    <!-- Technical Precision Anchors in Lightning Gold -->
    <circle cx="22" cy="18" r="1.5" fill="#FFC52E"/>
    <circle cx="96" cy="18" r="1.5" fill="#FFC52E"/>
    <circle cx="22" cy="102" r="1.5" fill="#FFC52E"/>
    <circle cx="96" cy="102" r="1.5" fill="#FFC52E"/>
  </g>
</svg>
